<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis settings</title>
<style>
:root {
  --bg: #090d12;
  --surface: #0f151d;
  --surface-2: #131b25;
  --surface-3: #19232f;
  --line: #1e2834;
  --line-2: #2a3644;
  --text: #e6eef6;
  --muted: #8a97a6;
  --faint: #5d6a7a;
  --accent: #00e5ff;
  --accent-ink: #00262b;
  --accent-soft: rgba(0, 229, 255, .09);
  --accent-line: rgba(0, 229, 255, .38);
  --warn: #ffb74d;
  --warn-soft: rgba(255, 183, 77, .09);
  --danger: #ff6b6b;
  --danger-soft: rgba(255, 107, 107, .09);
  --ok: #5ee0a0;
  --r: 10px;
  --r-sm: 7px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* layout */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); grid-template-rows: 60px minmax(0, 1fr); height: 100vh; }
header {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 0 20px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.logo {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, #c9f8ff 0 26%, var(--accent) 28% 36%, transparent 38%);
  box-shadow: 0 0 0 1.5px var(--accent-line), 0 0 16px rgba(0, 229, 255, .3);
}
.brand { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.brand span { color: var(--muted); font-weight: 400; }
.spacer { flex: 1; }
.pill { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.pill.dirty { color: var(--warn); background: var(--warn-soft); }
.pill.saved { color: var(--ok); }
nav { border-right: 1px solid var(--line); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow: auto; background: var(--surface); }
.nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px;
  background: transparent; color: var(--muted); text-align: left;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--accent-soft); color: var(--text); }
.nav-item.active .icon { color: var(--accent); }
.nav-label { flex: 1; }
.nav-mark { width: 7px; height: 7px; border-radius: 50%; }
.nav-item.changed .nav-mark { background: var(--warn); }
.nav-item.invalid .nav-mark { background: var(--danger); }
.nav-foot { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 2px; }
.nav-foot .nav-item { font-size: 13px; }
.nav-paths { font-size: 12px; color: var(--faint); padding: 8px 10px 0; line-height: 1.6; word-break: break-all; }
main { overflow: auto; }
.content { max-width: 860px; padding: 28px 32px 96px; }
.content.wide { max-width: 1240px; }

/* section */
.section-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.section-head > div { flex: 1; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.intro { color: var(--muted); margin: 0; max-width: 64ch; }
.cards { display: grid; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card h2 { font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; padding: 14px 18px 0; }
.field { padding: 16px 18px; }
.card-body > .field + .field { border-top: 1px solid var(--line); }
.field-head { display: flex; align-items: center; gap: 10px; min-height: 26px; }
.label { font-weight: 600; flex: 1; }
.help { color: var(--muted); font-size: 13px; margin: 2px 0 10px; max-width: 70ch; }
.field-head + .pick, .field-head + .chips, .field-head + .slider, .field-head + .table, .field-head + div, .field-head + input, .field-head + textarea, .field-head + span { margin-top: 8px; }
.error { color: var(--danger); font-size: 13px; margin-top: 6px; }
.error:empty { display: none; }
.field.invalid input:focus, .field.invalid select:focus { outline-color: rgba(255, 107, 107, .5); }
.field.flash { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }
.reset {
  display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--muted);
  font-size: 12.5px; padding: 2px 6px; border-radius: 6px;
}
.reset:hover { color: var(--accent); background: var(--accent-soft); }

/* controls */
input[type=text], input[type=number], textarea, select {
  width: 100%; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-sm);
  padding: 7px 10px; min-height: 36px;
}
textarea { resize: vertical; line-height: 1.55; }
select { cursor: pointer; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent-line); outline-offset: 0; border-color: var(--accent); }
input.bad { border-color: var(--danger); }
.num { display: inline-flex; align-items: center; gap: 8px; }
.num input { width: 104px; }
.unit { color: var(--muted); font-size: 13px; white-space: nowrap; }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; }
input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
.ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-top: 2px; }
.pick-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.pick-row:has(.other:not([hidden])) { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
.hint:empty { display: none; }
.hint .ok { color: var(--ok); }
.hint .warn { color: var(--warn); }
.inline { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.color { display: inline-flex; align-items: center; gap: 8px; }
.color input[type=color] { width: 36px; height: 36px; padding: 2px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface-2); cursor: pointer; }
.color input.hex { width: 104px; font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: var(--r-sm); cursor: text; }
.chips:focus-within { outline: 2px solid var(--accent-line); border-color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 2px; padding: 2px 3px 2px 10px; border-radius: 999px; background: var(--surface-3); border: 1px solid var(--line-2); font-size: 13px; }
.chip button { width: 20px; height: 20px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); line-height: 1; padding: 0; }
.chip button:hover { background: var(--danger-soft); color: var(--danger); }
.chips input { flex: 1; min-width: 150px; border: 0 !important; outline: 0 !important; background: transparent !important; min-height: 26px !important; padding: 2px 6px !important; }
.chips.fixed { cursor: default; min-height: 38px; align-items: center; }
.chips .empty { padding: 0 6px; }
.picks { display: grid; gap: 8px; }
.tool-words { display: grid; gap: 8px; }
.tool-row { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 12px; align-items: start; }
.tool-row label { font-size: 13px; color: var(--muted); padding-top: 9px; }

.table { display: grid; gap: 8px; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: var(--cols); gap: 8px; align-items: center; }
.row.head { font-size: 12px; color: var(--faint); }
.row.head span { padding-left: 2px; }
.empty { color: var(--faint); margin: 0; font-size: 13px; }
.table .add { justify-self: start; }
.states .row { --cols: minmax(0, 1fr) 152px 140px; padding: 4px 6px; border-radius: 8px; }
.states .row.active { background: var(--accent-soft); }
.state-name { border: 0; background: transparent; text-align: left; padding: 4px 0; display: grid; }
.state-name small { color: var(--muted); font-size: 12px; }
.state-name:hover b { color: var(--accent); }
.rings .row:not(.head):hover, .rings .row:focus-within { background: var(--accent-soft); border-radius: 8px; }
.rings .row input { min-width: 0; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px;
  border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2); font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--faint); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--surface-2); }
.btn.small { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.danger:hover { color: var(--danger); }
.icon-btn {
  display: inline-grid; place-items: center; width: 32px; height: 32px; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--danger-soft); color: var(--danger); }
.icon { display: inline-grid; place-items: center; flex: none; }
kbd { font: 11px Consolas, monospace; padding: 1px 5px; border-radius: 4px; background: rgba(0, 0, 0, .18); margin-left: 4px; }

/* banners */
.banner { border: 1px solid var(--accent-line); background: var(--accent-soft); border-radius: var(--r); padding: 12px 16px; margin-bottom: 18px; }
.banner.warn { border-color: rgba(255, 183, 77, .4); background: var(--warn-soft); }
.banner b { display: block; margin-bottom: 2px; }

/* mic meter */
.meter-box { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--surface-2); display: grid; gap: 10px; }
.meter-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.meter { position: relative; height: 12px; border-radius: 6px; background: var(--bg); overflow: hidden; }
.meter-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--faint); transition: width 70ms linear; }
.meter-fill.speech { background: var(--accent); }
.meter-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--warn); }
.meter-legend { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); }
.readout { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
.readout b { color: var(--text); }
.note { font-size: 13px; color: var(--muted); }
.warn-text { color: var(--warn); font-size: 13px; }

/* orb preview */
.split { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 22px; align-items: start; }
.preview { position: sticky; top: 0; }
.preview-card { padding: 14px; display: grid; gap: 12px; }
.segs { display: flex; flex-wrap: wrap; gap: 4px; }
.seg { border: 1px solid var(--line-2); background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; }
.seg:hover { color: var(--text); }
.seg.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.stage {
  border-radius: 8px; overflow: hidden; display: flex; justify-content: center;
  background: radial-gradient(120% 90% at 25% 0%, #22405f 0%, #102031 50%, #0a121b 100%);
}
.stage canvas { display: block; width: 100%; height: auto; }
.preview-note { margin: 0; font-size: 13px; color: var(--muted); }

/* toasts & dialog */
.toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 10px; z-index: 20; justify-items: end; }
.toast {
  position: relative; max-width: 440px; padding: 12px 40px 12px 14px; border-radius: 9px; background: var(--surface-3);
  border: 1px solid var(--line-2); border-left: 3px solid var(--accent); box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
.toast.ok { border-left-color: var(--ok); }
.toast.error { border-left-color: var(--danger); }
.toast ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.toast .icon-btn { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; }
dialog { width: min(920px, 94vw); padding: 0; border: 1px solid var(--line-2); border-radius: 12px; background: var(--surface); color: var(--text); }
dialog::backdrop { background: rgba(0, 0, 0, .6); }
.dialog-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.tab { border: 0; background: transparent; color: var(--muted); padding: 6px 10px; border-radius: 7px; font-family: Consolas, monospace; font-size: 13px; }
.tab.active { background: var(--accent-soft); color: var(--text); }
.dialog-note { margin: 0; padding: 10px 16px 0; font-size: 13px; color: var(--muted); }
pre.code { margin: 0; padding: 14px 16px 18px; max-height: 68vh; overflow: auto; font: 12.5px/1.55 Consolas, "Cascadia Mono", monospace; color: #cfe3f2; }

@media (max-width: 1100px) {
  .split { grid-template-columns: minmax(0, 1fr); }
  .preview { position: static; order: -1; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  header { flex-wrap: wrap; padding: 10px 16px; height: auto; }
  nav { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
  .nav-item { width: auto; white-space: nowrap; }
  .nav-foot { display: none; }
  .content { padding: 20px 16px 80px; }
  .slider, .tool-row { grid-template-columns: minmax(0, 1fr); }
  .tool-row { gap: 4px; }
  .rings .row, .browsers .row { --cols: 1fr 1fr !important; }
  .row.head { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true"></div>
    <div class="brand">Jarvis <span>settings</span></div>
    <span class="pill" id="status">Loading…</span>
    <div class="spacer"></div>
    <button class="btn ghost" id="discard" type="button">Discard changes</button>
    <button class="btn primary" id="save" type="button">Save <kbd>Ctrl+S</kbd></button>
  </header>
  <nav id="nav" aria-label="Settings sections"></nav>
  <main id="main"><div class="content" id="content"></div></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
const TOKEN = "{{TOKEN}}";
const STATES = ["starting", "sleeping", "listening", "thinking", "speaking", "error"];
const STATE_INFO = {
  starting: "Loading its models at launch",
  sleeping: "Waiting for the wake word",
  listening: "Recording your command",
  thinking: "Working out a reply",
  speaking: "Talking",
  error: "Something went wrong",
};
const SERVER_GONE = "The settings page lost its connection to Jarvis. Start it again with the \"Configure Jarvis\" task.";

// ---------------------------------------------------------------- helpers
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag), props = {};
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if (k === "value" || k === "checked" || k === "html") props[k] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  if ("html" in props) e.innerHTML = props.html;
  if ("value" in props) e.value = props.value;
  if ("checked" in props) e.checked = props.checked;
  return e;
}
const clone = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
const canon = v => JSON.stringify(v, (k, x) => x && typeof x === "object" && !Array.isArray(x)
  ? Object.fromEntries(Object.keys(x).sort().map(key => [key, x[key]])) : x);
const same = (a, b) => canon(a) === canon(b);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const titleCase = s => s.replace(/\b\w/g, c => c.toUpperCase());
const isHex = s => typeof s === "string" && /^#[0-9a-f]{6}$/i.test(s);
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const DURATION = /^(\d+(\.\d+)?(ms|s|m|h))+$/;
const snap = (v, step) => {
  const places = (String(step).split(".")[1] || "").length;
  return places ? Number(v.toFixed(places)) : v;
};

async function api(path, body) {
  let res;
  try {
    res = await fetch(path, {
      method: body === undefined ? "GET" : "POST",
      headers: { "X-Jarvis-Token": TOKEN, "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch {
    throw new Error(SERVER_GONE);
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `${res.status} ${res.statusText}`);
  return data;
}

const ICONS = {
  general: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  model: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  listening: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  commands: '<path d="M4 5h16v11H10l-6 4z"/>',
  websites: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3.5 3.5 3.5 14.5 0 18M12 3c-3.5 3.5-3.5 14.5 0 18"/>',
  contacts: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  orb: '<circle cx="12" cy="12" r="3.5"/><path d="M12 3a9 9 0 0 1 9 9M12 21a9 9 0 0 1-9-9"/>',
  files: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>',
  reset: '<path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/>',
  play: '<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  code: '<path d="m8 8-4 4 4 4M16 8l4 4-4 4"/>',
};
const icon = (name, size = 18) => h("span", {
  class: "icon",
  html: `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name]}</svg>`,
});

// ---------------------------------------------------------------- choices
const WHISPER = [
  { value: "tiny", label: "Tiny", hint: "Fastest, least accurate (about 75 MB)." },
  { value: "tiny.en", label: "Tiny, English only" },
  { value: "base", label: "Base", hint: "Fast, fair accuracy (about 145 MB)." },
  { value: "base.en", label: "Base, English only" },
  { value: "small", label: "Small", hint: "A good balance of speed and accuracy (about 480 MB)." },
  { value: "small.en", label: "Small, English only" },
  { value: "medium", label: "Medium", hint: "More accurate, noticeably slower on a laptop CPU (about 1.5 GB)." },
  { value: "medium.en", label: "Medium, English only" },
  { value: "large-v3-turbo", label: "Large v3 Turbo", hint: "The most accurate, slow on a CPU (about 1.6 GB)." },
].map(o => o.value.endsWith(".en")
  ? { ...o, hint: "A little more accurate for English, but understands nothing else." } : o);
const LANGUAGES = [
  ["en", "English"], ["ro", "Romanian"], ["de", "German"], ["fr", "French"], ["es", "Spanish"],
  ["it", "Italian"], ["nl", "Dutch"], ["pt", "Portuguese"], ["pl", "Polish"], ["hu", "Hungarian"],
].map(([value, label]) => ({ value, label }));
const languageName = code => LANGUAGES.find(o => o.value === code)?.label;
const languageProblem = code => /^[a-z]{2,3}$/.test(code) ? "" : `"${code}" isn't a language code like en or de.`;
const TITLES = [
  { value: "", label: "Your name", hint: "Or nothing, if you haven't given a name." },
  { value: "sir", label: "Sir" },
  { value: "miss", label: "Miss" },
  { value: "ma'am", label: "Ma'am" },
];
const CONTEXT = [
  { value: 1024, label: "1,024 tokens", hint: "Fastest, but forgets the start of a conversation sooner." },
  { value: 2048, label: "2,048 tokens", hint: "Lets the 3B model fit on a 4 GB graphics card, which makes replies about 30% faster." },
  { value: 4096, label: "4,096 tokens", hint: "Remembers more of long conversations; needs more memory." },
  { value: 8192, label: "8,192 tokens", hint: "For bigger graphics cards and bigger models." },
];
const KEEP_ALIVE = [
  { value: "5m", label: "5 minutes" },
  { value: "30m", label: "30 minutes" },
  { value: "1h", label: "1 hour" },
  { value: -1, label: "As long as Jarvis runs", hint: "Always quick, but the model's memory stays in use." },
  { value: 0, label: "Unload after every reply", hint: "Frees memory, but every reply waits several seconds for loading." },
];
const FONTS = ["Segoe UI", "Bahnschrift", "Calibri", "Arial", "Verdana", "Tahoma", "Consolas"].map(value => ({ value }));

function numProblem(v, f, what = "") {

  if (f.integer && !Number.isInteger(v)) return pre + "use a whole number.";
  if (f.min != null && v < f.min) return `${pre}use ${f.min} or more.`;
  if (f.max != null && v > f.max) return `${pre}use ${f.max} or less.`;

}

  { key: "speed", label: "Speed", min: -100, max: 100 },

function problem(f) {
  const v = val(f);

  switch (f.type) {
    case "number": case "slider": case "silence":
      return cap(numProblem(v, f));

      if (f.numeric) return cap(numProblem(v, f));
      if (f.keepAlive) return typeof v === "number" || DURATION.test(v || "") ? "" : "Use a time like 30m or 2h, or -1 to keep it loaded.";
      return f.required && blank(v) ? "Required." : "";
    case "text": case "textarea":
      return f.required && blank(v) ? "Required." : "";
    case "color":
      return isHex(v) ? "" : "Use a colour like #00e5ff.";
    case "beep":
      return numProblem(v?.hz, { min: 37, max: 32767, integer: true }, "Pitch")
          || numProblem(v?.ms, { min: 10, max: 5000, integer: true }, "Length");
    case "states": {
      const [colors, spin] = v;
      for (const s of STATES) {
        if (!isHex(colors?.[s])) return `${cap(s)}: use a colour like #00e5ff.`;
        const p = numProblem(spin?.[s], { min: -3600, max: 3600 }, `${cap(s)} speed`);
        if (p) return p;
      }
      return "";
    }
    case "rings":
      for (const [i, ring] of (v || []).entries())
        for (const k of RING_KEYS) { const p = numProblem(ring[k.key], k, `Ring ${i + 1} ${k.label.toLowerCase()}`); if (p) return p; }
      return "";
    case "picks":
      if (f.required && !(v || []).length) return "Choose at least one.";
      for (const x of v || []) { const p = f.check?.(x); if (p) return p; }
      return "";
    case "map":
      for (const [k, x] of Object.entries(v || {})) { const p = f.checkValue?.(x); if (p) return `"${k}": ${p}`; }
      return "";
    case "browsers":

        if (blank(b.new_tab)) return `"${k}": enter its new-tab page.`;

const WIDTH = 100;
function inline(v) {
  if (Array.isArray(v)) return "[" + v.map(inline).join(", ") + "]";
  if (v && typeof v === "object") {
    const e = Object.entries(v);
    return e.length ? "{ " + e.map(([k, x]) => JSON.stringify(k) + ": " + inline(x)).join(", ") + " }" : "{}";
  }
  return JSON.stringify(v);
}
function block(v, ind, used) {
  const flat = inline(v);
  if (v === null || typeof v !== "object" || used + flat.length < WIDTH) return flat;
  const next = ind + "  ";
  if (Array.isArray(v)) {
    if (v.every(x => x === null || typeof x !== "object")) {   // words wrap like text
      const lines = [""];
      for (const x of v.map(x => JSON.stringify(x))) {
        const cur = lines[lines.length - 1];
        if (cur && next.length + cur.length + x.length + 2 > WIDTH) { lines[lines.length - 1] += ","; lines.push(x); }
        else lines[lines.length - 1] = cur ? `${cur}, ${x}` : x;
      }
      return "[\n" + lines.map(l => next + l).join("\n") + "\n" + ind + "]";
    }
    return "[\n" + v.map(x => next + block(x, next, next.length)).join(",\n") + "\n" + ind + "]";
  }
  return "{\n" + Object.entries(v).map(([k, x]) => {
    const key = JSON.stringify(k) + ": ";
    return next + key + block(x, next, next.length + key.length);

const mic = {
  on: false, level: 0, error: "", listeners: new Set(),
  async start() {
    if (this.on) return;
    this.on = true;
    this.error = "";
    while (this.on) {
      try {
        this.level = (await api("/api/mic")).level;
      } catch (e) {
        this.error = e.message;
        this.on = false;
        this.level = 0;
      }
      this.listeners.forEach(fn => fn());
      await sleep(60);
    }
  },
  stop() {
    this.on = false;
    this.level = 0;
    this.listeners.forEach(fn => fn());
  },
};

function micMeter(f) {
  const fill = h("div", { class: "meter-fill" });
  const markEl = h("div", { class: "meter-mark", title: "Silence level" });
  const readout = h("span", { class: "readout" });
  const toggle = h("button", { type: "button", class: "btn small" });
  const measure = h("button", { type: "button", class: "btn small" }, "Measure room noise");
  const note = h("div", { class: "note" }, "Start the test and talk: the bar should turn blue when you speak and grey when you're quiet. Or stay quiet and measure the room noise to get a suggested level.");
  const scale = () => Math.max(3000, (val(f) || 0) * 1.25);
  let samples = null;
  const draw = () => {
    const level = mic.level, threshold = val(f) || 0;
    fill.style.width = `${Math.min(100, level / scale() * 100)}%`;
    fill.classList.toggle("speech", level > threshold);
    markEl.style.left = `calc(${Math.min(100, threshold / scale() * 100)}% - 1px)`;
    toggle.replaceChildren(icon("listening", 15), mic.on ? "Stop test" : "Test microphone");
    readout.replaceChildren(...(mic.error ? [h("span", { class: "warn-text" }, mic.error)]
      : mic.on ? ["Level ", h("b", {}, String(Math.round(level))), level > threshold ? " · speech" : " · silence"]
      : ["Microphone off"]));
    if (samples && mic.on) samples.push(level);
  };
  toggle.addEventListener("click", () => mic.on ? mic.stop() : mic.start());
  measure.addEventListener("click", async () => {
    measure.disabled = true;
    const started = !mic.on;
    if (started) mic.start();
    samples = [];
    for (let s = 3; s > 0; s--) {
      note.textContent = `Stay quiet… ${s}`;
      await sleep(1000);
    }
    const peak = Math.max(0, ...samples);
    samples = null;
    if (started) mic.stop();
    measure.disabled = false;
    if (mic.error) { note.textContent = mic.error; return; }
    const suggestion = Math.max(100, Math.ceil(Math.max(peak * 1.4, peak + 100) / 10) * 10);
    note.replaceChildren(`Room noise peaked at ${Math.round(peak)}. A silence level of ${suggestion} sits safely above it. `,
      h("button", { type: "button", class: "btn small", onclick: () => { setVal(f, suggestion); f.show(suggestion); draw(); } }, `Use ${suggestion}`));
  });
  mic.listeners.add(draw);
  f.redraw = draw;
  draw();
  return h("div", { class: "meter-box" },
    h("div", { class: "meter-top" }, toggle, measure, readout),
    h("div", {}, h("div", { class: "meter" }, fill, markEl),
      h("div", { class: "meter-legend" }, h("span", {}, "0"), h("span", {}, "▲ marks the silence level"), h("span", {}, String(Math.round(scale()))))),
    note);
}

let preview = null;

function previewAside() {

  const buttons = STATES.map(s => h("button", { type: "button", class: "seg", "data-state": s, onclick: () => preview.setState(s) }, cap(s)));
  const note = h("p", { class: "preview-note" });
  const useMic = h("input", { type: "checkbox" });
  const micNote = h("span", { class: "warn-text" });
  useMic.addEventListener("change", () => {
    preview.useMic = useMic.checked;
    if (useMic.checked) { preview.setState("listening"); mic.start(); } else mic.stop();
  });
  mic.listeners.add(() => {
    micNote.textContent = mic.error;
    if (!mic.on && useMic.checked) { useMic.checked = false; preview.useMic = false; }
  });
  preview.onState = s => {
    buttons.forEach(b => b.classList.toggle("active", b.dataset.state === s));
    document.querySelectorAll(".state-row").forEach(r => r.classList.toggle("active", r.dataset.state === s));
    note.textContent = s === "sleeping" ? "Sleeping: in Jarvis the orb fades out completely; it's dimmed here so you can see its colour."
                                        : `${cap(s)}: ${STATE_INFO[s].toLowerCase()}.`;
  };
  return h("aside", { class: "preview" }, h("div", { class: "card preview-card" },
    h("div", { class: "segs" }, buttons),
    h("div", { class: "stage" }, canvas),

    h("label", { class: "check" }, useMic, "Use my microphone for Listening"),
    micNote));
}

// ---------------------------------------------------------------- page
const nav = document.getElementById("nav");
const main = document.getElementById("main");
const content = document.getElementById("content");
const statusPill = document.getElementById("status");
const saveBtn = document.getElementById("save");
const discardBtn = document.getElementById("discard");
let current = SECTIONS[0];

function fieldView(f) {
  const reset = h("button", { type: "button", class: "reset", title: "Back to the default value", onclick: () => {
    setVal(f, clone(defVal(f)));
    renderSection(current.id, true);
  } }, icon("reset", 13), "Default");
  const error = h("div", { class: "error", role: "alert" });
  const root = h("div", { class: "field", id: `field-${f.id}` },
    h("div", { class: "field-head" }, h("label", { class: "label", for: f.id }, f.label), reset),
    f.help && h("p", { class: "help" }, f.help),
    CONTROLS[f.type](f),
    error);
  f.view = { root, reset, error };
  refreshField(f);
  return root;
}
function refreshField(f) {
  if (!f.view) return;
  f.view.reset.hidden = same(val(f), defVal(f));
  const p = problem(f);
  f.view.error.textContent = p;
  f.view.root.classList.toggle("invalid", !!p);
  f.redraw?.();
}
function changed(f) {
  if (f?.view) refreshField(f);
  updateChrome();
}
function updateChrome() {
  const dirty = isDirty();
  const firstRun = !saved.config;
  statusPill.className = "pill " + (dirty ? "dirty" : "saved");
  statusPill.textContent = firstRun ? "Not saved yet" : dirty ? "Unsaved changes" : "All changes saved";
  discardBtn.hidden = !dirty || firstRun;
  for (const sec of SECTIONS) {
    const fields = FIELDS.filter(f => f.section === sec.id);
    sec.navEl.classList.toggle("active", sec === current);
    sec.navEl.classList.toggle("changed", !!saved[sec.file] && fields.some(f => !same(val(f), savedVal(f))));
    sec.navEl.classList.toggle("invalid", fields.some(f => problem(f)));
  }
}

function banners() {
  const list = [];
  if (!saved.config) list.push(h("div", { class: "banner" }, h("b", {}, "Welcome! These are the default settings."),
    `Fill in your name, look through the pages, then press Save to create ${paths.config}.`));
  for (const n of notices) list.push(h("div", { class: "banner warn" }, n));
  return list;
}

function renderSection(id, keepScroll = false) {
  const sec = SECTIONS.find(s => s.id === id) || SECTIONS[0];
  mic.stop();
  mic.listeners.clear();
  preview?.stop();
  preview = null;
  const scroll = keepScroll ? main.scrollTop : 0;
  current = sec;
  const cards = sec.cards.map(c => h("section", { class: "card" },
    c.title && h("h2", {}, c.title),
    h("div", { class: "card-body" }, c.fields.map(fieldView))));
  const head = h("div", { class: "section-head" },
    h("div", {}, h("h1", {}, sec.title), h("p", { class: "intro" }, sec.intro)),
    h("button", { type: "button", class: "btn ghost small", onclick: () => resetSection(sec) }, icon("reset", 14), "Reset page"));
  content.className = "content" + (sec.wide ? " wide" : "");
  content.replaceChildren(...banners(), head,
    sec.wide ? h("div", { class: "split" }, h("div", { class: "cards" }, cards), previewAside()) : h("div", { class: "cards" }, cards));
  if (preview) { preview.setState(preview.state); preview.start(); }
  main.scrollTop = scroll;
  updateChrome();
}
function go(id) {
  history.replaceState(null, "", `#${id}`);
  renderSection(id);
}
function resetSection(sec) {
  for (const f of FIELDS.filter(f => f.section === sec.id)) setVal(f, clone(defVal(f)));
  renderSection(sec.id, true);
  toast(`${sec.title} is back to the defaults. Nothing is written until you press Save.`);
}
function resetAll() {
  if (!confirm("Put every setting back to the defaults, including your name, contacts and websites?\n\nNothing is written until you press Save.")) return;
  S = clone(D);
  renderSection(current.id, true);
  toast("Everything is back to the defaults. Press Save to keep it, or Discard changes to undo.");
}
function discard() {
  S = { config: clone(saved.config) || clone(D.config), ui: clone(saved.ui) || clone(D.ui) };
  fillMissing();
  renderSection(current.id, true);
  toast("Changes discarded.");
}

function renderNav() {
  nav.replaceChildren(
    ...SECTIONS.map(sec => sec.navEl = h("button", { type: "button", class: "nav-item", onclick: () => go(sec.id) },
      icon(sec.id), h("span", { class: "nav-label" }, sec.title), h("span", { class: "nav-mark" }))),
    h("div", { class: "nav-foot" },
      h("button", { type: "button", class: "nav-item", onclick: showJson }, icon("code"), h("span", { class: "nav-label" }, "Preview the files")),
      h("button", { type: "button", class: "nav-item", onclick: resetAll }, icon("reset"), h("span", { class: "nav-label" }, "Reset everything")),
      h("div", { class: "nav-paths" }, "Saves to", h("br"), paths.config, h("br"), paths.ui)));
}

function showJson() {
  const files = [["config", paths.config], ["ui", paths.ui]];
  let which = "config";
  const pre = h("pre", { class: "code" });
  const tabs = files.map(([key, path]) => h("button", { type: "button", class: "tab", onclick: () => { which = key; draw(); } }, path));
  const draw = () => {
    pre.textContent = formatJson(S[which], which);

  };
  const copy = h("button", { type: "button", class: "btn small", onclick: async () => {

  } }, "Copy");
  const dialog = h("dialog", { "aria-label": "Settings files" },

function toast(text, tone = "info", details = []) {
  const t = h("div", { class: `toast ${tone}`, role: tone === "error" ? "alert" : "status" },
    h("div", {}, text),
    details.length > 0 && h("ul", {}, details.map(d => h("li", {}, d))),
    h("button", { type: "button", class: "icon-btn", "aria-label": "Dismiss", onclick: () => t.remove() }, icon("close", 14)));

function afterSaveNotes(before) {
  const notes = [];
  for (const key of ["model_plugged_in", "model_on_battery"]) {
    const m = S.config[key];
    if (info.models && !info.models.includes(fullModel(m)) && !notes.some(n => n.includes(`"${m}"`)))
      notes.push(`The model "${m}" isn't downloaded yet: run the Setup task (or "ollama pull ${m}").`);
  }
  for (const v of S.config.piper_voices || [])
    if (!(info.voices || []).includes(v)) notes.push(`Run the Setup task to download the voice "${v}".`);
  if (before && before.whisper_model !== S.config.whisper_model)
    notes.push(`Jarvis downloads the "${S.config.whisper_model}" speech model the next time it starts, which can take a few minutes.`);
  return notes;

async function save() {
  const bad = FIELDS.filter(f => problem(f));
  if (bad.length) {
    const f = bad[0];
    if (current.id !== f.section) go(f.section);
    const el = document.getElementById(`field-${f.id}`);
    el?.scrollIntoView({ block: "center", behavior: "smooth" });
    el?.classList.add("flash");
    toast(`Fix ${bad.length === 1 ? "this setting" : `${bad.length} settings`} before saving. ${f.label}: ${problem(f)}`, "error");
    return;
  }
  saveBtn.disabled = true;
  try {
    const res = await api("/api/settings", { config: formatJson(S.config, "config"), ui: formatJson(S.ui, "ui") });
    const notes = afterSaveNotes(saved.config);
    saved = { config: clone(S.config), ui: clone(S.ui) };
    paths = res.paths;
    notices = [];
    renderNav();
    renderSection(current.id, true);
    toast(`Saved ${paths.config} and ${paths.ui}. Restart Jarvis to use the new settings.`, "ok", notes);
  } catch (e) {
    toast(e.message, "error");
  } finally {
    saveBtn.disabled = false;
  }
}

// Settings files from an older Jarvis may lack newer keys: fill them in from the defaults.
function fillMissing() {
  const added = [];
  for (const file of ["config", "ui"]) {
    for (const k of Object.keys(D[file])) if (!(k in S[file])) { S[file][k] = clone(D[file][k]); added.push(k); }
  }
  for (const k of ["colors", "spin"]) if (S.ui[k] && typeof S.ui[k] === "object") S.ui[k] = { ...D.ui[k], ...S.ui[k] };
  // a tool added since the file was written gets its default words
  // wake_word used to be a single name
  if (typeof S.config.wake_word === "string") S.config.wake_word = [S.config.wake_word];
  if (S.config.tool_words && typeof S.config.tool_words === "object") S.config.tool_words = { ...D.config.tool_words, ...S.config.tool_words };
  return added;
}

async function load() {
  try {
    const r = await api("/api/settings");
    info = r;
    D = r.defaults;
    paths = r.paths;
    saved = { config: r.config, ui: r.ui };
    S = { config: clone(r.config) || clone(D.config), ui: clone(r.ui) || clone(D.ui) };
    notices = [...r.problems];
    if (!r.ui && r.config) notices.push(`${paths.ui} doesn't exist yet, so the Orb page shows the defaults. Save to create it.`);
    const added = fillMissing();
    if (r.config && added.length) notices.push(`Your settings were missing ${added.join(", ")}, so the defaults were filled in. Save to add them to the file.`);
  } catch (e) {
    content.replaceChildren(h("div", { class: "banner warn" }, h("b", {}, "Couldn't load the settings."), e.message));
    statusPill.textContent = "Offline";
    return;
  }
  renderNav();
  renderSection(location.hash.slice(1) || "general");
}

saveBtn.addEventListener("click", save);
discardBtn.addEventListener("click", discard);
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); }
});
window.addEventListener("beforeunload", e => {
  if (S && isDirty()) { e.preventDefault(); e.returnValue = ""; }
});
window.addEventListener("pagehide", () => navigator.sendBeacon(`/api/bye?token=${encodeURIComponent(TOKEN)}`));
load();
</script>
</body>
</html>
